project: ptx-sweeps
name: pretrain_finetune_v6_pretrain
method: grid

command:
  - ${env}
  - python
  - ${envvar:HOME}/ptx-mini/train_single.py
  - data.path=/dev/shm/fineweb_math_4096_10/fineweb_edu_10B.bin
  - model.save_dir=~/gcs/ptx-mini/runs/sweep_pretrain_finetune_2d_v6_pretrain
  - opt.lr_decay=cosine
  - ${args_no_hyphens}

parameters:
  stop.tokens_per_param:
    values: [20, 28, 40, 57, 80, 113, 160, 226, 320, 453, 640, 905, 1280]
  model.D:
    values: [256, 288, 320, 352, 384, 416, 448, 480, 512, 544, 576, 608, 640]
