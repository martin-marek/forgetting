project: ptx-sweeps
name: method_comp_v7_with_replay
method: grid

command:
  - ${env}
  - python
  - ${envvar:HOME}/ptx-mini/train_single.py
  - data.path=/dev/shm/fineweb_math_4096_10/nemotron_math_20M.bin
  - model.load_path=~/gcs/ptx-mini/runs/fwedu/42gol3bt
  - stop.early_stop_steps=10
  - opt.peak_lr=1e-5
  - reg.coeff=10
  - reg.batch_size=64
  - reg.buffer=16
  - ${args_no_hyphens}

parameters:
  reg.method:
    values: ['kl_pre', 'ntp_pre'] # -> 2x
  reg.synth:
    values: [False, True] # -> 2x
