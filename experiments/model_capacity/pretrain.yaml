project: ptx-sweeps
name: model_capacity_v2_pretrain
method: grid

command:
  - ${env}
  - WANDB_JOB_TYPE=pretrain
  - python
  - ${envvar:HOME}/ptx-mini/train_single.py
  - data.path=/dev/shm/c4_10B/c4_en.bin
  - mix.path=/dev/shm/c4_10B/c4_es.bin
  - model.save_dir=~/gcs/ptx-mini/runs/model_capacity_v2
  - opt.lr_decay=cosine
  - stop.num_epochs=10
  - ${args_no_hyphens}

parameters:
  mix.coeff:
    values: [0.0078125, 0.015625, 0.03125, 0.0625, 0.125, 0.25, 0.5, 0.75, 0.875, 0.9375, 0.96875, 0.984375, 0.9921875] # -> 13x
