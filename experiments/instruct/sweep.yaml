project: ptx-sweeps
name: instruct_v1
method: grid

command:
  - ${env}
  - python
  - ${envvar:HOME}/forgetting/experiments/instruct/ptx/train_lm.py
  - model.source=alpindale/Llama-3.2-1B-Instruct
  - model.tp_size=2
  - train.dataset=bnadimi/PyraNet-Verilog
  - train.split=train
  - train.seq_len=512
  - train.batch_size=128
  - train.num_tokens_valid=20_000_000
  - opt.lr=1e-5
  - opt.n_epochs=5
  - log.evals=[train_lm,reg_lm,chat_mcq,verilog]
  - reg.dataset=allenai/dolmino-mix-1124
  - reg.split=train
  - reg.seq_len=512
  - reg.batch_size=32
  - reg.buffer=32
  - ${args_no_hyphens}

parameters:
  reg.method:
    values: ['null', 'ntp_pre', 'kl_pre'] # -> 2x
  reg.synth:
    values: [False, True] # -> 2x
  reg.coeff:
    values: [1, 3, 10] # -> 3x
